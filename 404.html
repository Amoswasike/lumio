<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="description"
        content="The page you're looking for could not be found. Return to Lumio Finance."
    >

    <meta name="theme-color" content="#ffffff">

    <title>Page Not Found — Lumio Finance</title>


    <!-- Favicon -->

    <link
        rel="icon"
        type="image/svg+xml"
        href="assets/brand/logos/favicon/favicon.svg"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="assets/brand/logos/favicon/favicon-32x32.png"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="16x16"
        href="assets/brand/logos/favicon/favicon-16x16.png"
    >

    <link
        rel="apple-touch-icon"
        href="assets/brand/logos/favicon/apple-touch-icon.png"
    >


    <!-- Main stylesheet -->

    <link
        rel="stylesheet"
        href="css/main.css"
    >

</head>


<body>

    <main class="error-page">

        <div class="error-content">


            <!-- Brand -->

            <a
                href="index.html"
                class="error-brand"
                aria-label="Lumio Finance home"
            >

                <img
                    src="assets/brand/logos/lumio-logo.svg"
                    alt="Lumio Finance"
                >

            </a>


            <!-- Error message -->

            <p class="eyebrow">
                404
            </p>

            <h1>
                That page doesn't exist.
            </h1>

            <p>
                The page you're looking for may have moved,
                been removed, or never existed.
            </p>


            <!-- Primary action -->

            <a
                class="button button-primary"
                href="index.html"
            >
                Back to home
            </a>

        </div>

    </main>

</body>

</html>
